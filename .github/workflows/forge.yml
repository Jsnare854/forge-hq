name: Forge HQ

on:
  schedule:
    - cron: "7 11 * * *"    # drafts ~7am Eastern
    - cron: "7 19 * * *"    # drafts ~3pm Eastern
    - cron: "17 12 * * 1"   # weekly shop report, Monday ~8am Eastern
  issues:
    types: [labeled, closed]
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [check, draft, publish, report, unpack, test]
        default: check
      seed:
        description: "Draft: seed idea (blank = next line in seeds.txt)"
        default: ""
      issue:
        description: "Publish: issue number"
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  unpack:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'unpack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f forge-hq.zip || { echo "Upload forge-hq.zip to the repo first."; exit 1; }
          unzip -o -q forge-hq.zip
          git rm -q forge-hq.zip
          git config user.name "forge-hq bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Forge HQ code"
          git push

  check:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m forge check
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IDEOGRAM_API_KEY: ${{ secrets.IDEOGRAM_API_KEY }}

  draft:
    if: (github.event_name == 'schedule' && github.event.schedule != '17 12 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.task == 'draft')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency: {group: forge-draft}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m forge draft --seed "$SEED" ${{ github.event_name == 'schedule' && '--auto' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          IDEOGRAM_API_KEY: ${{ secrets.IDEOGRAM_API_KEY }}
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          SEED: ${{ inputs.seed }}
      - run: |
          git config user.name "forge-hq bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts
          git diff --cached --quiet && exit 0
          git commit -m "Drafts $(date -u +%F)"
          git pull --rebase
          git push
      - run: python -m forge file-issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: failure()
        run: |
          python -m forge log --text "❌ Draft run failed, open ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} for details."
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    if: (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'approved') || (github.event_name == 'workflow_dispatch' && inputs.task == 'publish')
    runs-on: ubuntu-latest
    concurrency: {group: "forge-publish-${{ github.event.issue.number || inputs.issue }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m forge publish --issue "$ISSUE" --actor "$ACTOR"
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          ACTOR: ${{ github.actor }}

  report:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 12 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.task == 'report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m forge report
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

  cleanup:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m forge cleanup --issue "$ISSUE"
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}

  test:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest -q
